# Builds the Dockerfile and pushes the image to GitHub Container Registry.
#
# That is the whole job. Deployment is pull-based: a separate machine polls the
# registry for a new :latest and restarts itself. This workflow never contacts
# the server and holds no server credentials.
#
# ONE-TIME MANUAL STEP: a GHCR package is created PRIVATE by default. The pull
# side is unauthenticated, so after the first successful push you must flip the
# package to public by hand — repo -> Packages -> orrery_game -> Package
# settings -> Change visibility. Until you do, the server's pull fails with a
# "denied"/"not found" error that looks nothing like a permissions problem.
name: Build and push image

on:
  push:
    branches: [master]
  workflow_dispatch:

# A multi-minute build shouldn't queue up behind itself. If you push twice in
# quick succession, the older run is cancelled rather than run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hardcoded lowercase on purpose. GHCR rejects uppercase paths, and the owner
  # is "Thrasherop" — interpolating ${{ github.repository }} raw would try to
  # push to ghcr.io/Thrasherop/... and fail.
  IMAGE: ghcr.io/thrasherop/orrery_game

jobs:
  build:
    runs-on: ubuntu-latest

    # The build compiles a WASM kernel, runs a full Godot export, and Brotli-
    # compresses a ~44 MB index.wasm at quality 11. The first (uncached) run is
    # the slow one; this ceiling is deliberately generous.
    timeout-minutes: 60

    # Declared explicitly rather than relying on repo defaults: GITHUB_TOKEN
    # needs package write to push, and nothing more.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Buildx is what makes the `type=gha` cache backend below available; the
      # stock docker builder cannot export layer cache to GitHub's cache API.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token, scoped by the `permissions` block above. No PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          # Single platform. arm64 would roughly double the build time for an
          # x86 target that will never pull it.
          platforms: linux/amd64

          # Two tags, one image. :latest is what the server pulls; the SHA tag
          # is the rollback handle — pin the deploy to it when :latest is bad.
          # Full SHA rather than short, so it matches what `git log` prints.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

          # The single most important setting here. Each CI run starts on a
          # fresh runner, so without a cache every build re-downloads the
          # Emscripten SDK plus the Godot editor and export templates — roughly
          # a gigabyte — before it even reaches your code. mode=max stores the
          # intermediate stages too, which is what lets a code-only change
          # reuse those toolchain layers.
          #
          # If you ever see cache misses on every run, suspect eviction: the
          # GHA cache is capped at 10 GB per repo and evicts by age, and these
          # layers are large. Dropping to mode=min is the first knob to try.
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # Push a plain single image manifest. Left at its default, this
          # action also attaches a provenance attestation, which turns the push
          # into a multi-manifest index and litters the package page with
          # untagged "unknown/unknown" entries. Harmless for `docker pull`, but
          # pull-based redeploy tools compare digests, and the extra manifests
          # are a needless way to confuse them.
          provenance: false
